name: embedded-qa

on:
  push:
    paths: ["embedded_qa_portfolio/**", ".github/workflows/embedded-qa.yml"]
  pull_request:
    paths: ["embedded_qa_portfolio/**", ".github/workflows/embedded-qa.yml"]

defaults:
  run:
    working-directory: embedded_qa_portfolio

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Requirement change guard
        run: |
          if [[ "${GITHUB_REF}" == refs/heads/vm/* ]]; then
            git fetch origin main
            if ! git diff --quiet origin/main -- requirements/swr.yaml; then
              if ! git log -1 --pretty=%B | grep -qi "approval issue"; then
                echo "Error: requirements/swr.yaml modified on vm/ branch without approval issue in commit message."
                exit 1
              fi
            fi
          fi
      - run: pip install pyyaml
      - name: Requirement quality check
        run: python tools/req_check.py
      - name: D4 Traceability Matrix
        run: python tools/d4_matrix.py
      - name: DBC consistency check (database vs firmware header)
        run: python tools/dbc_lint.py can/bms.dbc --header firmware/include/bms.h
      - name: Test-case tag check (D2 guideline)
        run: python tools/tc_tag_check.py
      - name: Plant model tests
        run: python -m unittest discover -s plant -v
      - name: Install SIL dependencies
        run: pip install pytest python-can
      - name: SIL tests
        run: cd sil && PYTHONPATH=.. pytest test_sil.py -v --junitxml=../report.xml
      - name: Generate SIL test report
        if: always()
        run: python tools/sil_report.py

      - name: Tool tests
        run: python -m unittest discover -s tests -v

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the CI container
        run: docker build -t bms-ci ci
      - name: Build, test, coverage, ARM cross-build, reproducibility
        run: >
          docker run --rm -e GITHUB_SHA
          -v "$GITHUB_WORKSPACE":/work -w /work/embedded_qa_portfolio
          bms-ci bash ci/pipeline.sh build/ci
      - name: Publish summary
        if: always()
        run: cat build/ci/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-pipeline
          path: |
            embedded_qa_portfolio/build/ci/metrics.json
            embedded_qa_portfolio/build/ci/summary.md
            embedded_qa_portfolio/build/ci/*.log
            embedded_qa_portfolio/build/ci/*.txt
