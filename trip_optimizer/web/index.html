<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Trip Optimizer</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        textarea { width: 100%; font-family: monospace; }
        .error { color: red; }
        .err-span { color: red; }
        .plan { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
        footer { margin-top: 40px; font-size: 0.8em; color: #666; }
        .day { margin-left: 20px; }
    </style>
</head>
<body>
    <h1>Trip Optimizer</h1>
    
    <div>
        <label>Start City: <input type="text" id="startCity" value="Seoul"></label>
        <label>End City: <input type="text" id="endCity" value="Seoul"></label>
    </div>
    
    <div>
        <label>Start Date (YYYY-MM-DD): <input type="date" id="startDate" value="2027-04-01"></label>
        <label>Planning Days: <input type="number" id="days" value="14" min="1"></label>
        <label>1시간의 가치(원): <input type="number" id="costPerHour" value="12000" min="0"> <span id="cpmDisplay"></span></label> <span id="costPerHourError" class="err-span"></span>
    </div>

    <button id="btnExample">Load Example Dataset</button>
    <p id="exampleNote" style="display:none; color: #555;"><i>Note: Prices in this example dataset are entirely invented!</i></p>

    <h3>Visit Cities (city,min_stay,max_stay) <span id="visitLinesError" class="err-span"></span></h3>
    <textarea id="visitLines" rows="5">Tokyo,2,4
Osaka,1,3
Kyoto,2,4
Fukuoka,1,2</textarea>
    
    <h3>Transport CSV (from,to,date,mode,price,minutes) <span id="transportLinesError" class="err-span"></span></h3>
    <textarea id="transportLines" rows="8"></textarea>
    
    <h3>Lodging CSV (city,date,price) <span id="lodgingLinesError" class="err-span"></span></h3>
    <textarea id="lodgingLines" rows="5"></textarea>
    
    <br><br>
    <button id="btnOptimize">Optimize (K=5)</button>
    
    <div id="status"></div>
    <div id="notices" style="color: #888; font-style: italic;"></div>
    <div id="results"></div>
    
    <footer>
        Build commit hash: <span id="commitHash">UNKNOWN_COMMIT</span>
    </footer>

    <script type="module">
        import { parseData, getExampleData, encodeState, decodeState } from './model.mjs';

        function el(tag, text, children = []) {
            const e = document.createElement(tag);
            if (text !== null) e.textContent = text;
            children.forEach(c => e.appendChild(c));
            return e;
        }

        document.getElementById('btnExample').addEventListener('click', () => {
            document.getElementById('exampleNote').style.display = 'block';
            const data = getExampleData();
            document.getElementById('startCity').value = data.startCity;
            document.getElementById('endCity').value = data.endCity;
            document.getElementById('startDate').value = data.startDate;
            document.getElementById('days').value = data.days;
            document.getElementById('visitLines').value = data.visitLines;
            document.getElementById('transportLines').value = data.transportLines;
            document.getElementById('lodgingLines').value = data.lodgingLines;
        });

        const worker = new Worker('worker.mjs', { type: 'module' });
        
        let pendingResolve = null;
        let pendingReject = null;
        let workerDead = false;

        function showError(msg) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = msg;
            statusDiv.className = 'error';
        }

        worker.onmessage = (e) => {
            const data = e.data;
            if (data.type === 'ready') {
                console.log("Worker ready");
                checkHashAndRun();
            } else if (data.type === 'error') {
                if (pendingReject) {
                    pendingReject(new Error(data.error));
                } else {
                    showError(data.error);
                }
            } else if (data.type === 'success') {
                if (pendingResolve) pendingResolve(data);
            }
        };
        worker.onerror = (e) => {
            console.error("Worker error:", e);
            workerDead = true;
            const msg = e.message || "Worker failed to load";
            if (pendingReject) {
                pendingReject(new Error(msg));
            } else {
                showError(msg);
            }
        };

        worker.postMessage({ type: 'init' });

        function updateCpmDisplay() {
            const val = parseInt(document.getElementById('costPerHour').value, 10);
            const cpm = Math.round((isNaN(val) ? 0 : val) / 60);
            document.getElementById('cpmDisplay').textContent = `(${cpm}원/분)`;
        }
        document.getElementById('costPerHour').addEventListener('input', updateCpmDisplay);
        updateCpmDisplay();

        function getInputState() {
            return {
                startCity: document.getElementById('startCity').value.trim(),
                endCity: document.getElementById('endCity').value.trim(),
                visitLines: document.getElementById('visitLines').value,
                transportLines: document.getElementById('transportLines').value,
                lodgingLines: document.getElementById('lodgingLines').value,
                startDate: document.getElementById('startDate').value,
                days: parseInt(document.getElementById('days').value, 10),
                costPerHour: document.getElementById('costPerHour').value,
                k: 5
            };
        }

        function setInputState(data) {
            document.getElementById('startCity').value = data.startCity;
            document.getElementById('endCity').value = data.endCity;
            document.getElementById('startDate').value = data.startDate;
            document.getElementById('days').value = data.days;
            document.getElementById('costPerHour').value = data.costPerHour;
            updateCpmDisplay();
            document.getElementById('visitLines').value = data.visitLines;
            document.getElementById('transportLines').value = data.transportLines;
            document.getElementById('lodgingLines').value = data.lodgingLines;
        }

        function checkHashAndRun() {
            if (window.location.hash.length > 2) {
                const s = decodeState(window.location.hash);
                if (s) {
                    setInputState(s);
                    document.getElementById('btnOptimize').click();
                }
            }
        }

        document.getElementById('btnOptimize').addEventListener('click', async () => {
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');
            const noticesDiv = document.getElementById('notices');
            
            // clear errors
            ['visitLines', 'transportLines', 'lodgingLines'].forEach(id => {
                document.getElementById(id + 'Error').textContent = '';
            });

            if (workerDead) {
                statusDiv.textContent = 'Worker failed to load. Please refresh the page.';
                statusDiv.className = 'error';
                return;
            }
            
            statusDiv.textContent = 'Parsing data...';
            statusDiv.className = '';
            resultsDiv.textContent = '';
            noticesDiv.textContent = '';
            
            const rawInput = getInputState();
            let parsed;
            try {
                parsed = parseData(rawInput);
            } catch (err) {
                if (err.inputId) {
                    const span = document.getElementById(err.inputId + 'Error');
                    if (span) {
                        span.textContent = ` (Line ${err.lineNum || '?'}: ${err.message})`;
                    }
                    statusDiv.textContent = 'Validation error. Please check the inputs.';
                } else {
                    statusDiv.textContent = `Error parsing data: ${err.message}`;
                }
                statusDiv.className = 'error';
                return;
            }
            
            window.history.replaceState(null, '', '#' + encodeState(rawInput));

            let notices = [];
            if (parsed.skippedLines > 0) notices.push(`Skipped ${parsed.skippedLines} out-of-window lines.`);
            if (!document.getElementById('lodgingLines').value.trim()) notices.push('숙박비 미포함');
            
            if (notices.length > 0) {
                noticesDiv.textContent = notices.join(' | ');
            }
            
            statusDiv.textContent = 'Optimizing...';
            
            try {
                const res = await new Promise((resolve, reject) => {
                    pendingResolve = resolve;
                    pendingReject = reject;
                    worker.postMessage({ type: 'optimize', payload: parsed });
                });
                
                statusDiv.textContent = `Found ${res.numPlans} plans.`;
                if (res.numPlans === 0) {
                    statusDiv.textContent += ' No valid plans found.';
                    return;
                }
                
                const cpm = Math.round((parseInt(rawInput.costPerHour, 10) || 0) / 60);
                
                res.plans.forEach((plan, i) => {
                    const div = document.createElement('div');
                    div.className = 'plan';
                    
                    div.appendChild(el('h4', `Plan ${i + 1} (Total Cost: ${plan.objective})`));
                    
                    const timeValue = plan.travel_minutes * cpm;
                    const sum = plan.transport_price + plan.lodging_price + timeValue;
                    
                    const costUl = el('ul', null, [
                        el('li', `Transport: ${plan.transport_price}`),
                        el('li', `Lodging: ${plan.lodging_price}`),
                        el('li', `Time Value: ${timeValue} (${plan.travel_minutes} min * ${cpm})`),
                        el('li', `Sum: ${sum}`)
                    ]);
                    div.appendChild(el('h5', 'Cost Breakdown'));
                    div.appendChild(costUl);

                    // Timeline
                    const timelineUl = el('ul', null);
                    const timelineEvents = [];
                    plan.legs.forEach(l => timelineEvents.push({ date: l.date, text: `${l.from} -> ${l.to} (${l.mode}, ${l.minutes} min)` }));
                    plan.stays.forEach(s => timelineEvents.push({ date: s.arriveDate, text: `Stay in ${s.city} (${s.nights} nights)` }));
                    timelineEvents.sort((a, b) => a.date.localeCompare(b.date));
                    timelineEvents.forEach(e => {
                        timelineUl.appendChild(el('li', `${e.date}: ${e.text}`));
                    });
                    div.appendChild(el('h5', 'Timeline'));
                    div.appendChild(timelineUl);
                    
                    // Booking List
                    const bookUl = el('ul', null);
                    plan.legs.forEach(l => {
                        bookUl.appendChild(el('li', `[Leg] ${l.date} ${l.from} -> ${l.to} : ${l.price} won`));
                    });
                    plan.stays.forEach(s => {
                        bookUl.appendChild(el('li', `[Stay] ${s.arriveDate} in ${s.city} for ${s.nights} nights : ${s.price} won`));
                    });
                    div.appendChild(el('h5', 'Booking List'));
                    div.appendChild(bookUl);
                    
                    resultsDiv.appendChild(div);
                });
            } catch (err) {
                statusDiv.textContent = `Error during optimization: ${err.message}`;
                statusDiv.className = 'error';
            }
        });
    </script>
</body>
</html>
