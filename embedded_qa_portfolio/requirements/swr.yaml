# SW requirements v0.1 for the BMS firmware.
#
# Every number here is a design assumption for this portfolio project, not a
# value from a real cell datasheet or production BMS.
#
# Fields
#   id        SWR-NNN
#   text      one verifiable statement with a numeric criterion where it applies
#   parent    safety goal (SG-*) or feature (FN-*) ids
#   method    test | review | analysis
#   priority  must | should | could
#   area      grouping used in reports

requirements:
  # --- Measurement and signal plausibility ------------------------------------
  - id: SWR-001
    text: BMS는 셀 전압 4개, 온도 2개, 팩 전류 1개를 10 ms 주기로 샘플링해야 한다.
    parent: [SG-01, SG-02, SG-03, SG-04]
    method: test
    priority: must
    area: measurement
  - id: SWR-002
    text: 셀 전압 측정값이 0.50 V 미만이거나 5.00 V 초과이면 해당 채널을 신호 고장으로 판정해야 한다.
    parent: [SG-01, SG-02]
    method: test
    priority: must
    area: measurement
  - id: SWR-003
    text: 온도 측정값이 -40.0 °C 미만이거나 125.0 °C 초과이면 해당 채널을 신호 고장으로 판정해야 한다.
    parent: [SG-03]
    method: test
    priority: must
    area: measurement
  - id: SWR-004
    text: 신호 고장이 3회 연속 샘플(30 ms) 지속되면 BMS는 FAULT 상태로 전이하고 컨택터 개방을 명령해야 한다.
    parent: [SG-01, SG-02, SG-03]
    method: test
    priority: must
    area: measurement

  # --- Protection -------------------------------------------------------------
  - id: SWR-005
    text: 어느 셀이든 전압이 4.25 V를 초과하는 상태가 3회 연속 샘플(30 ms) 지속되면 과전압(OV) 고장으로 판정해야 한다.
    parent: [SG-01]
    method: test
    priority: must
    area: protection
  - id: SWR-006
    text: 어느 셀이든 전압이 2.80 V 미만인 상태가 3회 연속 샘플(30 ms) 지속되면 저전압(UV) 고장으로 판정해야 한다.
    parent: [SG-02]
    method: test
    priority: must
    area: protection
  - id: SWR-007
    text: 어느 온도 채널이든 60.0 °C를 초과하는 상태가 3회 연속 샘플(30 ms) 지속되면 과온(OT) 고장으로 판정해야 한다.
    parent: [SG-03]
    method: test
    priority: must
    area: protection
  - id: SWR-008
    text: 충전 전류가 흐르는 중 어느 온도 채널이든 0.0 °C 미만인 상태가 3회 연속 샘플(30 ms) 지속되면 저온 충전(UTC) 고장으로 판정해야 한다.
    parent: [SG-01]
    method: test
    priority: must
    area: protection
  - id: SWR-009
    text: 방전 전류가 150 A를 초과하거나 충전 전류가 50 A를 초과하는 상태가 3회 연속 샘플(30 ms) 지속되면 과전류(OC) 고장으로 판정해야 한다.
    parent: [SG-04]
    method: test
    priority: must
    area: protection
  - id: SWR-010
    text: 보호 고장 조건이 처음 발생한 시점부터 컨택터 개방 명령까지 걸리는 시간은 100 ms 이하여야 한다.
    parent: [SG-01, SG-02, SG-03, SG-04]
    method: test
    priority: must
    area: protection
  - id: SWR-011
    text: FAULT 상태에서는 VCU_Cmd.ContactorReq가 1이어도 컨택터를 닫아서는 안 된다.
    parent: [SG-01, SG-02, SG-03, SG-04]
    method: test
    priority: must
    area: protection

  # --- State machine and contactor --------------------------------------------
  - id: SWR-012
    text: 전원 인가 후 BMS는 INIT 상태에서 측정 채널 점검을 마치고 100 ms 이내에 STANDBY 상태로 전이해야 한다.
    parent: [FN-01]
    method: test
    priority: must
    area: state_machine
  - id: SWR-013
    text: STANDBY 상태에서 VCU_Cmd.ContactorReq가 1이고 활성 고장이 없으면 BMS는 20 ms 이내에 컨택터 닫힘을 명령하고 CLOSED 상태로 전이해야 한다.
    parent: [FN-01]
    method: test
    priority: must
    area: state_machine
  - id: SWR-014
    text: CLOSED 상태에서 VCU_Cmd.ContactorReq가 0이 되면 BMS는 20 ms 이내에 컨택터 개방을 명령하고 STANDBY 상태로 전이해야 한다.
    parent: [FN-01]
    method: test
    priority: must
    area: state_machine
  - id: SWR-015
    text: VCU_Cmd를 300 ms 동안 수신하지 못하면 통신 고장으로 판정하고 다음 BMS_Status 송신부터 CommFault 신호를 1로 보고해야 한다.
    parent: [SG-05, FN-01]
    method: test
    priority: must
    area: communication
  - id: SWR-016
    text: VCU_Cmd의 메시지 카운터가 직전 값에 1을 더한 값(15 다음은 0)이 아니거나 체크섬이 일치하지 않으면 해당 프레임의 내용을 사용해서는 안 된다.
    parent: [SG-05, FN-01]
    method: test
    priority: must
    area: communication

  # --- CAN transmission --------------------------------------------------------
  - id: SWR-017
    text: BMS는 BMS_Status 메시지를 100 ms ± 10 ms 주기로 송신해야 한다.
    parent: [FN-02]
    method: test
    priority: must
    area: communication
  - id: SWR-018
    text: BMS는 BMS_CellV 메시지와 BMS_Temp 메시지를 각각 100 ms ± 10 ms 주기로 송신해야 한다.
    parent: [FN-02]
    method: test
    priority: must
    area: communication
  - id: SWR-019
    text: 보호 고장이 판정되면 BMS는 10 ms 이내에 BMS_Fault 메시지를 송신하고, 이후 고장이 유지되는 동안 100 ms ± 10 ms 주기로 송신해야 한다.
    parent: [SG-01, SG-02, SG-03, SG-04, FN-02]
    method: test
    priority: must
    area: communication

  # --- SOC ---------------------------------------------------------------------
  - id: SWR-020
    text: 1 C 정전류 방전 3600 s 프로파일에서 BMS가 보고하는 SOC와 플랜트 모델 SOC의 오차는 3 %p 이하여야 한다.
    note: 추정 방식(전류 적산)은 설계 결정이므로 요구사항이 아니라 설계 문서에 둔다.
    parent: [FN-03]
    method: analysis
    priority: should
    area: soc

  # --- Diagnostics (UDS) ---------------------------------------------------------
  - id: SWR-021
    text: 보호 고장과 신호 고장마다 고유한 DTC를 두고, 고장 판정 시 상태 바이트의 testFailed(bit 0)와 confirmedDTC(bit 3)를 1로 설정해야 한다.
    parent: [FN-04, SG-01, SG-02, SG-03, SG-04]
    method: test
    priority: must
    area: diagnostics
  - id: SWR-022
    text: BMS는 UDS 0x10으로 defaultSession(0x01)과 extendedDiagnosticSession(0x03) 전환을 지원하고, extended 세션에서 5000 ms 동안 진단 요청이 없으면 defaultSession으로 복귀해야 한다.
    parent: [FN-04]
    method: test
    priority: must
    area: diagnostics
  - id: SWR-023
    text: BMS는 UDS 0x3E(zeroSubFunction)를 받으면 긍정 응답을 보내고 세션 타이머를 다시 시작해야 한다.
    parent: [FN-04]
    method: test
    priority: must
    area: diagnostics
  - id: SWR-024
    text: BMS는 UDS 0x22로 DID 5개(0xF195 SW 버전, 0x0101 팩 전압, 0x0102 SOC, 0x0103 셀 전압 4개, 0x0104 최고 온도)를 읽을 수 있게 해야 한다.
    parent: [FN-04]
    method: test
    priority: must
    area: diagnostics
  - id: SWR-025
    text: BMS는 UDS 0x19 subfunction 0x02(reportDTCByStatusMask) 요청에 상태 마스크와 일치하는 모든 DTC를 응답해야 한다.
    parent: [FN-04]
    method: test
    priority: must
    area: diagnostics
  - id: SWR-026
    text: BMS는 UDS 0x14(groupOfDTC 0xFFFFFF)를 받으면 저장된 모든 DTC를 삭제하고 긍정 응답을 보내야 한다.
    parent: [FN-04, SG-01, SG-02, SG-03, SG-04]
    method: test
    priority: must
    area: diagnostics
  - id: SWR-027
    text: BMS는 미지원 서비스에 NRC 0x11, 미지원 subfunction에 NRC 0x12, 길이 오류에 NRC 0x13, 미지원 DID에 NRC 0x31로 부정 응답해야 한다.
    parent: [FN-04]
    method: test
    priority: must
    area: diagnostics

  # --- Implementation constraints ------------------------------------------------
  - id: SWR-028
    text: BMS 펌웨어의 app 계층은 동적 메모리 할당 함수(malloc, calloc, realloc, free)를 사용해서는 안 된다.
    parent: [SG-01, SG-02, SG-03, SG-04]
    method: analysis
    priority: must
    area: implementation

  # --- Added in v0.1 review: split from compound requirements (W01) -------------
  - id: SWR-029
    text: FAULT 상태의 BMS는 모든 고장 조건이 해소되고 UDS 0x14로 DTC가 삭제된 뒤 10 ms 이내에 STANDBY로 전이해야 한다.
    parent: [SG-01, SG-02, SG-03, SG-04, FN-01]
    method: test
    priority: must
    area: protection
    split_from: SWR-011
  - id: SWR-030
    text: 통신 고장 상태에서 컨택터가 닫혀 있으면 BMS는 팩 전류의 절댓값이 5 A 이하인 상태가 3회 연속 샘플(30 ms) 지속된 뒤에만 컨택터 개방을 명령해야 한다.
    parent: [SG-05, FN-01]
    method: test
    priority: must
    area: communication
    split_from: SWR-015
  - id: SWR-031
    text: VCU_Cmd 프레임이 SWR-016에 따라 연속 3프레임 거부되면 BMS는 통신 고장으로 판정해야 한다. 단, 체크섬이 유효한 프레임이 거부된 경우 해당 프레임의 카운터를 새로운 기준으로 동기화하여 단일 프레임 손실이 통신 고장으로 이어지지 않도록 한다.
    parent: [SG-05, FN-01]
    method: test
    priority: must
    area: communication
    split_from: SWR-016
  - id: SWR-032
    text: UDS 응답 데이터가 7바이트를 초과하면 BMS는 ISO-TP First Frame과 Consecutive Frame으로 분할 송신해야 한다.
    parent: [FN-04]
    method: test
    priority: must
    area: diagnostics
    split_from: SWR-025
