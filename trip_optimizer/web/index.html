<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trip Optimizer</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        textarea { width: 100%; font-family: monospace; }
        .error { color: red; }
        .plan { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
        footer { margin-top: 40px; font-size: 0.8em; color: #666; }
    </style>
</head>
<body>
    <h1>Trip Optimizer</h1>
    
    <div>
        <label>Start City: <input type="text" id="startCity" value="Seoul"></label>
        <label>End City: <input type="text" id="endCity" value="Seoul"></label>
    </div>
    
    <div>
        <label>Start Date (YYYY-MM-DD): <input type="date" id="startDate" value="2027-04-01"></label>
        <label>Planning Days: <input type="number" id="days" value="14" min="1"></label>
        <label>Cost per minute (won): <input type="number" id="costPerMinute" value="200" min="0"></label>
    </div>

    <button id="btnExample">Load Example Dataset</button>
    <p id="exampleNote" style="display:none; color: #555;"><i>Note: Prices in this example dataset are entirely invented!</i></p>

    <h3>Visit Cities (city,min_stay,max_stay)</h3>
    <textarea id="visitLines" rows="5">Tokyo,2,4
Osaka,1,3
Kyoto,2,4
Fukuoka,1,2</textarea>
    
    <h3>Transport CSV (from,to,date,mode,price,minutes)</h3>
    <textarea id="transportLines" rows="8"></textarea>
    
    <h3>Lodging CSV (city,date,price)</h3>
    <textarea id="lodgingLines" rows="5"></textarea>
    
    <br><br>
    <button id="btnOptimize">Optimize (K=5)</button>
    
    <div id="status"></div>
    <div id="results"></div>
    
    <footer>
        Build commit hash: <span id="commitHash">UNKNOWN_COMMIT</span>
    </footer>

    <script type="module">
        import { parseData, decodePlans } from './model.mjs';

        // Example dataset generation
        document.getElementById('btnExample').addEventListener('click', () => {
            document.getElementById('exampleNote').style.display = 'block';
            
            document.getElementById('startCity').value = 'Seoul';
            document.getElementById('endCity').value = 'Seoul';
            document.getElementById('startDate').value = '2027-04-01';
            document.getElementById('days').value = '14';
            
            document.getElementById('visitLines').value = "Tokyo,2,3\nOsaka,1,2\nKyoto,2,3\nFukuoka,1,2";
            
            const cities = ['Seoul', 'Tokyo', 'Osaka', 'Kyoto', 'Fukuoka'];
            let trans = "";
            let lodg = "";
            
            // roughly 2 weeks: 2027-04-01 to 2027-04-14
            for (let d = 0; d < 14; d++) {
                const dateStr = `2027-04-${(d+1).toString().padStart(2, '0')}`;
                
                for (const c of cities) {
                    if (c !== 'Seoul') {
                        lodg += `${c},${dateStr},${50000 + (c.length * 10000)}\n`;
                    }
                }
                
                for (let i = 0; i < cities.length; i++) {
                    for (let j = 0; j < cities.length; j++) {
                        if (i === j) continue;
                        const c1 = cities[i];
                        const c2 = cities[j];
                        
                        // Mode 1: Flight (expensive, fast)
                        // Mode 2: Train (cheap, slow) - let's just make it simple
                        
                        // Only add flights involving Seoul, and trains in Japan
                        if (c1 === 'Seoul' || c2 === 'Seoul') {
                            trans += `${c1},${c2},${dateStr},Flight,${200000 + (d * 5000)},120\n`;
                        } else {
                            trans += `${c1},${c2},${dateStr},Train,${10000 + (d * 1000)},60\n`;
                            trans += `${c1},${c2},${dateStr},Bus,${5000},180\n`; // 2 modes
                        }
                    }
                }
            }
            document.getElementById('transportLines').value = trans;
            document.getElementById('lodgingLines').value = lodg;
        });

        const worker = new Worker('worker.mjs', { type: 'module' });
        
        let pendingResolve = null;
        let pendingReject = null;

        worker.onmessage = (e) => {
            const data = e.data;
            if (data.type === 'ready') {
                console.log("Worker ready");
            } else if (data.type === 'error') {
                if (pendingReject) pendingReject(new Error(data.error));
            } else if (data.type === 'success') {
                if (pendingResolve) pendingResolve(data);
            }
        };

        worker.postMessage({ type: 'init' });

        document.getElementById('btnOptimize').addEventListener('click', async () => {
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');
            
            statusDiv.innerHTML = 'Parsing data...';
            statusDiv.className = '';
            resultsDiv.innerHTML = '';
            
            let parsed;
            try {
                parsed = parseData({
                    startCity: document.getElementById('startCity').value.trim(),
                    endCity: document.getElementById('endCity').value.trim(),
                    visitLines: document.getElementById('visitLines').value,
                    transportLines: document.getElementById('transportLines').value,
                    lodgingLines: document.getElementById('lodgingLines').value,
                    startDate: document.getElementById('startDate').value,
                    days: parseInt(document.getElementById('days').value, 10),
                    costPerMinute: parseInt(document.getElementById('costPerMinute').value, 10),
                    k: 5
                });
            } catch (err) {
                statusDiv.innerHTML = `Error parsing data: ${err.message}`;
                statusDiv.className = 'error';
                return;
            }
            
            if (parsed.skippedLines > 0) {
                console.warn(`Skipped ${parsed.skippedLines} out-of-window lines`);
            }
            
            statusDiv.innerHTML = 'Optimizing...';
            
            try {
                const res = await new Promise((resolve, reject) => {
                    pendingResolve = resolve;
                    pendingReject = reject;
                    worker.postMessage({ type: 'optimize', payload: parsed });
                });
                
                statusDiv.innerHTML = `Found ${res.numPlans} plans.`;
                
                if (res.numPlans === 0) {
                    statusDiv.innerHTML += ' No valid plans found.';
                    return;
                }
                
                const plans = decodePlans(res.outArray, res.numPlans, 5, parsed.V, parsed.nodeToCity, parsed.modeIdxToName, parsed.startDate);
                
                plans.forEach((plan, i) => {
                    const div = document.createElement('div');
                    div.className = 'plan';
                    
                    let html = `<h4>Plan ${i + 1} (Total Cost: ${plan.objective})</h4>`;
                    html += `<p>Transport: ${plan.transport_price}, Lodging: ${plan.lodging_price}, Travel Minutes: ${plan.travel_minutes}</p>`;
                    
                    html += `<h5>Legs</h5><ul>`;
                    plan.legs.forEach(l => {
                        html += `<li>${l.date} ${l.from} -> ${l.to} (${l.mode}): ${l.price} won, ${l.minutes} min</li>`;
                    });
                    html += `</ul>`;
                    
                    html += `<h5>Stays</h5><ul>`;
                    plan.stays.forEach(s => {
                        html += `<li>${s.arriveDate}: ${s.nights} nights in ${s.city} (Lodging: ${s.price} won)</li>`;
                    });
                    html += `</ul>`;
                    
                    div.innerHTML = html;
                    resultsDiv.appendChild(div);
                });
            } catch (err) {
                statusDiv.innerHTML = `Error during optimization: ${err.message}`;
                statusDiv.className = 'error';
            }
        });
    </script>
</body>
</html>
