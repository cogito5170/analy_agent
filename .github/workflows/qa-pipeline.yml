name: qa-pipeline

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -t . -v
      - name: Run the agent pipeline against the demo app
        run: python -m qa_agents run --spec demo/spec/mini_shop.json --demo-server --claims demo/claims.json --out runs/ci
      - uses: actions/upload-artifact@v4
        with:
          name: qa-run
          path: runs/ci
